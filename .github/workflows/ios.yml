name: iOS
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - name: Install project generator
        run: brew install xcodegen
      - name: Privacy inventory
        run: bash scripts/privacy-guard.sh
      - name: Generate project
        run: make project
      - name: Create iPhone 16 simulator
        run: bash scripts/create-iphone16-simulator.sh
      - name: Build and test iPhone 16
        run: |
          mkdir -p build
          xcodebuild -project App/QuietApp.xcodeproj -scheme QuietApp -destination 'platform=iOS Simulator,name=Quiet-iPhone-16' -resultBundlePath build/QuietApp.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Preserve test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone16-test-results
          path: build/QuietApp.xcresult
